# Project-wide settings (committed). Plain KEY=VALUE, no quotes, no spaces around '='.
# Every key can be overridden per environment (config/<env>.conf), by a git-ignored config/<env>.secret.conf,
# or by an environment variable of the same name. Full list and meaning: docs/CONFIGURATION.md

PROJECT_NAME=bank
DB_ENV=local

# ---- files ----
HISTORY_TABLE=schema_version
MIGRATIONS_DIR=migrations
UNDO_DIR=migrations/undo
REPEATABLE_DIR=repeatable
SMOKE_SQL=scripts/validate.sql

# Environments that need CONFIRM=yes for migrate/step/undo/repair (comma separated, e.g. prod,uat)
PROTECTED_ENVS=prod

# ---- bundled local Oracle container (RUNNER=docker) ----
# COMPOSE_PROJECT=db and CONTAINER_NAME=oracle-free keep the container created by earlier versions of this repo
# (changing them makes 'up' create a NEW, empty database). New projects: leave COMPOSE_PROJECT unset.
COMPOSE_PROJECT=db
ORACLE_IMAGE=gvenzl/oracle-free:slim
CONTAINER_NAME=oracle-free
HOST_PORT=1521
ORACLE_PASSWORD=Oracle123
APP_USER=bank
APP_USER_PASSWORD=Bank123
