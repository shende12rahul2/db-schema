# The local Oracle container created by the OLD instructions on main ("docker run --name oracle-free ..." + scripts/deploy.sh).
# That container is not managed by docker compose, so we reach it through the sqlplus helper on its published port.
# Usage:  migrate.sh --env legacy-local up   (helper only)  ->  plan  ->  baseline  ->  migrate
# Throw-away local container only; real databases keep their password in <env>.secret.conf.
RUNNER=docker-client
DB_HOST=host.docker.internal
DB_PORT=1521
DB_SERVICE=FREEPDB1
DB_USER=bank
DB_PASSWORD=Bank123
